<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Maturitní Pomocník</title>
    <style>
        :root {
            --glass-bg: rgba(30, 15, 50, 0.4);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #9333ea;
            --text-main: #f8fafc;
        }
        body { 
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif;
            background: #05020a; color: var(--text-main); text-align: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(120, 40, 200, 0.2), transparent 40%);
        }
        .container { max-width: 800px; margin: 0 auto; }
        .glass-panel { 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px;
        }
        .card-container { perspective: 1000px; margin: 20px auto; width: 100%; max-width: 500px; height: 250px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 24px; padding: 20px; box-sizing: border-box; }
        .card-back { transform: rotateY(180deg); border: 1px solid var(--accent-purple); }
        button { padding: 12px 24px; cursor: pointer; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border); border-radius: 12px; transition: 0.3s; margin: 5px; }
        button:hover { background: rgba(255,255,255,0.15); }
        .quiz-item { text-align: left; margin: 15px 0; padding: 20px; }
        .quiz-correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .quiz-incorrect { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        #loading { display: none; color: #d8b4fe; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Maturitní Pomocník</h1>
        <div class="glass-panel">
            <input type="file" id="fileInput" accept=".pdf,.txt">
            <button onclick="uploadFile()" style="background: var(--accent-purple)">Generovat</button>
            <p id="loading">Gemma přemýšlí...</p>
        </div>
        <nav style="margin: 20px 0;">
            <button onclick="showSection('flash')">Kartičky</button>
            <button onclick="showSection('quiz')">Test</button>
        </nav>
        <div id="flash" class="section">
            <div class="card-container" onclick="toggleCard()" id="flashCard">
                <div class="card-inner">
                    <div class="glass-panel card-front"><div>Otázka se zobrazí zde...</div></div>
                    <div class="glass-panel card-back"><div>Odpověď se zobrazí zde...</div></div>
                </div>
            </div>
            <button onclick="prevCard()">←</button><button onclick="nextCard()">→</button>
        </div>
        <div id="quiz" class="section" style="display:none">
            <div id="quizBox"></div>
            <button onclick="gradeQuiz()" style="background: var(--accent-purple)">Vyhodnotit</button>
        </div>
    </div>
    <script>
        let store = { flashcards: [], quiz: [] }, idx = 0, currentFile = "";
        function showSection(id) { document.querySelectorAll('.section').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Vyberte soubor!");
            currentFile = file.name;
            document.getElementById('loading').style.display = "block";
            const fd = new FormData(); fd.append("file", file);
            try {
                const r = await fetch("/upload", { method: "POST", body: fd });
                const res = await r.json();
                store = JSON.parse(res.result);
                renderFlash(); renderQuiz();
            } catch(e) { alert("Chyba při generování."); }
            finally { document.getElementById('loading').style.display = "none"; }
        }
        function toggleCard() { document.getElementById("flashCard").classList.toggle('flipped'); }
        function renderFlash() {
            if(!store.flashcards.length) return;
            document.querySelector('.card-front div').innerText = store.flashcards[idx].q;
            document.querySelector('.card-back div').innerText = store.flashcards[idx].a;
            document.getElementById("flashCard").classList.remove('flipped');
        }
        function nextCard() { if(idx < store.flashcards.length-1) { idx++; renderFlash(); } }
        function prevCard() { if(idx > 0) { idx--; renderFlash(); } }
        function renderQuiz() {
            document.getElementById("quizBox").innerHTML = store.quiz.map((q, i) => `
                <div class="glass-panel quiz-item" id="q${i}">
                    <p><b>${q.q}</b></p>
                    ${q.options.map(o => `<label style="display:block"><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join('')}
                </div>`).join('');
        }
        function gradeQuiz() {
            let score = 0;
            store.quiz.forEach((q, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                const div = document.getElementById(`q${i}`);
                if(sel && sel.value === q.correct) { score++; div.className = 'glass-panel quiz-item quiz-correct'; }
                else { div.className = 'glass-panel quiz-item quiz-incorrect'; }
            });
            alert(`Tvé skóre: ${score} z ${store.quiz.length}`);
            fetch('/save_score', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: currentFile, score: score, total: store.quiz.length})});
        }
    </script>
</body>
</html>
