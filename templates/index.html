<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Maturitní Pomocník | Premium</title>
    <style>
        :root {
            --glass-bg: rgba(25, 10, 40, 0.6);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-purple: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --text-main: #f8fafc;
        }

        body { 
            margin: 0; padding: 20px; font-family: 'Inter', -apple-system, sans-serif;
            background: #030008; color: var(--text-main); text-align: center;
            background-image: radial-gradient(circle at 15% 15%, rgba(120, 40, 200, 0.2), transparent 40%);
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        .glass { 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* 3D KARTA */
        .card-container { perspective: 1000px; margin: 30px auto; width: 100%; max-width: 500px; height: 300px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; align-items: center; justify-content: center; padding: 30px; 
            box-sizing: border-box; border-radius: 24px; font-size: 20px; border: 1px solid var(--glass-border);
        }
        .card-back { transform: rotateY(180deg); background: rgba(168, 85, 247, 0.1); border-color: var(--accent-purple); }

        button { 
            padding: 12px 24px; cursor: pointer; background: rgba(255,255,255,0.05); color: white; 
            border: 1px solid var(--glass-border); border-radius: 14px; transition: 0.3s; font-weight: 600;
        }
        button:hover { background: var(--accent-purple); box-shadow: 0 0 20px var(--accent-glow); border-color: transparent; }

        .btn-active { background: var(--accent-purple); border-color: transparent; }

        .quiz-item { text-align: left; margin: 20px 0; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.02); }
        .quiz-correct { border: 1px solid #22c55e; background: rgba(34,197,94,0.1); }
        .quiz-incorrect { border: 1px solid #ef4444; background: rgba(239,68,68,0.1); }

        #loading { display: none; color: var(--accent-purple); font-weight: bold; margin: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">🎓 Maturitní AI Asistent</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Nahraj dokument a začni se učit chytře.</p>

        <div class="glass">
            <input type="file" id="fileInput" accept=".pdf,.txt">
            <button onclick="uploadFile()">✨ Generovat</button>
            <p id="loading">Gemma analyzuje text...</p>
        </div>

        <div style="margin: 30px 0; display: flex; gap: 10px; justify-content: center;">
            <button id="nav-flash" class="btn-active" onclick="showSection('flash')">Kartičky</button>
            <button id="nav-quiz" onclick="showSection('quiz')">Test</button>
        </div>

        <div id="flash" class="section">
            <div class="card-container" onclick="this.classList.toggle('flipped')" id="flashCard">
                <div class="card-inner">
                    <div class="glass card-front"><div id="qText">Sem přijde otázka...</div></div>
                    <div class="glass card-back"><div id="aText">...a sem odpověď.</div></div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="prevCard()">←</button>
                <button onclick="nextCard()">→</button>
            </div>
        </div>

        <div id="quiz" class="section" style="display:none">
            <div id="quizBox"></div>
            <button onclick="gradeQuiz()" style="width: 100%; margin-top: 20px;">Vyhodnotit výsledky</button>
        </div>
    </div>

    <script>
        let store = { flashcards: [], quiz: [] }, idx = 0, currentFile = "";

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('[id^="nav-"]').forEach(b => b.classList.remove('btn-active'));
            document.getElementById(id).style.display = 'block';
            document.getElementById('nav-' + id).classList.add('btn-active');
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Vyberte soubor!");
            currentFile = file.name;
            const loader = document.getElementById('loading');
            loader.style.display = "block";

            const fd = new FormData();
            fd.append("file", file);

            try {
                const r = await fetch("/upload", { method: "POST", body: fd });
                const res = await r.json();
                if(res.error) throw new Error(res.error);
                
                // Oprava pro případ, že AI vrátí string místo objektu
                store = typeof res.result === 'string' ? JSON.parse(res.result) : res.result;
                idx = 0;
                renderFlash();
                renderQuiz();
                alert("Hotovo! Materiály jsou připraveny.");
            } catch(e) {
                console.error(e);
                alert("Chyba při generování: " + e.message);
            } finally {
                loader.style.display = "none";
            }
        }

        function renderFlash() {
            if(!store.flashcards.length) return;
            document.getElementById('qText').innerText = store.flashcards[idx].q;
            document.getElementById('aText').innerText = store.flashcards[idx].a;
            document.getElementById("flashCard").classList.remove('flipped');
        }

        function nextCard() { if(idx < store.flashcards.length-1) { idx++; renderFlash(); } }
        function prevCard() { if(idx > 0) { idx--; renderFlash(); } }

        function renderQuiz() {
            document.getElementById("quizBox").innerHTML = store.quiz.map((q, i) => `
                <div class="quiz-item" id="q${i}">
                    <p><b>${i+1}. ${q.q}</b></p>
                    ${q.options.map(o => `<label style="display:block; margin: 8px 0; cursor:pointer">
                        <input type="radio" name="q${i}" value="${o}"> ${o}
                    </label>`).join('')}
                </div>`).join('');
        }

        function gradeQuiz() {
            let score = 0;
            store.quiz.forEach((q, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                const div = document.getElementById(`q${i}`);
                if(sel && sel.value === q.correct) {
                    score++;
                    div.className = 'quiz-item quiz-correct';
                } else {
                    div.className = 'quiz-item quiz-incorrect';
                }
            });
            alert(`Tvé skóre: ${score} z ${store.quiz.length}`);
            fetch('/save_score', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: currentFile, score: score, total: store.quiz.length})});
        }
    </script>
</body>
</html>
