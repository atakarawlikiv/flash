<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Maturitní Pomocník | Premium</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
        }

        body { 
            margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif;
            background: #05020a; color: #f8fafc; text-align: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(120, 40, 200, 0.15), transparent 40%);
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        .glass-panel { 
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 3D KARTY */
        .card-container { perspective: 1000px; margin: 25px auto; width: 100%; max-width: 500px; height: 300px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; align-items: center; justify-content: center; padding: 30px; 
            box-sizing: border-box; border-radius: 24px; font-size: 1.3rem; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02);
        }
        .card-back { transform: rotateY(180deg); background: rgba(168, 85, 247, 0.05); border-color: var(--accent); color: #e9d5ff; }

        button { 
            padding: 12px 28px; cursor: pointer; background: rgba(255,255,255,0.05); color: white; 
            border: 1px solid var(--glass-border); border-radius: 12px; transition: 0.3s; font-weight: 600;
        }
        button:hover { background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); border-color: transparent; }
        .active-tab { background: var(--accent) !important; }

        input[type="file"] { margin: 15px 0; font-size: 14px; }
        
        .quiz-item { text-align: left; margin: 15px 0; padding: 20px; border-radius: 18px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.01); }
        .quiz-correct { border-color: #22c55e; background: rgba(34,197,94,0.05); }
        .quiz-incorrect { border-color: #ef4444; background: rgba(239,68,68,0.05); }

        #loader { display: none; color: var(--accent); font-weight: bold; margin: 15px; animation: breathe 2s infinite; }
        @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-weight: 800; font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 5px;">Graduation Assistant</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">Uč se efektivně s pomocí umělé inteligence.</p>

        <div class="glass-panel">
            <input type="file" id="fileInput" accept=".pdf,.txt">
            <button onclick="uploadFile()">Generovat materiály</button>
            <div id="loader">Gemma analyzuje text...</div>
        </div>

        <div style="margin: 25px 0; display: flex; gap: 10px; justify-content: center;">
            <button id="btn-flash" class="active-tab" onclick="switchTab('flash')">Kartičky</button>
            <button id="btn-quiz" onclick="switchTab('quiz')">Testy</button>
        </div>

        <div id="flash" class="tab-content">
            <div class="card-container" onclick="this.classList.toggle('flipped')" id="flashCard">
                <div class="card-inner">
                    <div class="card-front"><div id="qText">Zde se objeví otázka...</div></div>
                    <div class="card-back"><div id="aText">...a zde odpověď.</div></div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button onclick="prevCard()">←</button>
                <button onclick="nextCard()">→</button>
            </div>
        </div>

        <div id="quiz" class="tab-content" style="display:none">
            <div id="quizBox"></div>
            <button onclick="gradeQuiz()" style="width: 100%; margin-top: 15px;">Vyhodnotit test</button>
        </div>
    </div>

    <script>
        let store = { flashcards: [], quiz: [] }, idx = 0, currentFilename = "";

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(tab).style.display = 'block';
            document.getElementById('btn-' + tab).classList.add('active-tab');
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Vyberte soubor!");
            currentFilename = file.name;
            const loader = document.getElementById('loader');
            loader.style.display = "block";

            const fd = new FormData();
            fd.append("file", file);

            try {
                const r = await fetch("/upload", { method: "POST", body: fd });
                const res = await r.json();
                if(res.error) throw new Error(res.error);
                
                store = JSON.parse(res.result);
                idx = 0;
                renderFlash();
                renderQuiz();
                switchTab('flash');
            } catch(e) {
                alert("Chyba při generování materiálu.");
                console.error(e);
            } finally {
                loader.style.display = "none";
            }
        }

        function renderFlash() {
            if(!store.flashcards.length) return;
            document.getElementById('qText').innerText = store.flashcards[idx].q;
            document.getElementById('aText').innerText = store.flashcards[idx].a;
            document.getElementById("flashCard").classList.remove('flipped');
        }

        function nextCard() { if(idx < store.flashcards.length-1) { idx++; renderFlash(); } }
        function prevCard() { if(idx > 0) { idx--; renderFlash(); } }

        function renderQuiz() {
            document.getElementById("quizBox").innerHTML = store.quiz.map((q, i) => `
                <div class="quiz-item" id="q${i}">
                    <p style="margin-top:0"><b>${i+1}. ${q.q}</b></p>
                    ${q.options.map(o => `<label style="display:block; margin: 10px 0; cursor:pointer">
                        <input type="radio" name="q${i}" value="${o}"> ${o}
                    </label>`).join('')}
                </div>`).join('');
        }

        function gradeQuiz() {
            let score = 0;
            store.quiz.forEach((q, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                const div = document.getElementById(`q${i}`);
                if(sel && sel.value === q.correct) {
                    score++;
                    div.className = 'quiz-item quiz-correct';
                } else {
                    div.className = 'quiz-item quiz-incorrect';
                }
            });
            alert(`Tvé skóre: ${score} z ${store.quiz.length}`);
            fetch('/save_score', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({filename: currentFilename, score: score, total: store.quiz.length})});
        }
    </script>
</body>
</html>
