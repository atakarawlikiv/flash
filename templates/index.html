<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Maturitní Pomocník</title>
    <style>
        :root {
            --glass-bg: rgba(30, 15, 50, 0.4);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --accent-purple: #9333ea;
            --accent-yellow: #facc15;
            --text-main: #f8fafc;
        }

        body { 
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif;
            background-color: #05020a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 40, 200, 0.2), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(80, 20, 150, 0.2), transparent 35%);
            background-attachment: fixed;
            color: var(--text-main); text-align: center; min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }
        .glass-panel { 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--glass-shadow); 
        }

        .header-box { padding: 30px; margin-bottom: 30px; }
        
        /* 3D KARTY */
        .card-container {
            perspective: 1000px; margin: 25px auto; width: 100%; max-width: 550px; height: 250px; cursor: pointer;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; box-sizing: border-box; border-radius: 24px; font-size: 20px;
        }
        .card-back { transform: rotateY(180deg); border-color: var(--accent-purple); }
        .flash-label { font-size: 12px; text-transform: uppercase; color: #c084fc; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }

        /* TLAČÍTKA */
        button { 
            padding: 12px 24px; cursor: pointer; background: rgba(255, 255, 255, 0.05); color: white; 
            border: 1px solid var(--glass-border); border-radius: 14px; transition: 0.3s; font-weight: 600;
        }
        button:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .nav-btn.active { background: rgba(147, 51, 234, 0.6); border-color: var(--accent-purple); }
        .btn-purple { background: var(--accent-purple); border: none; }
        .btn-yellow { color: var(--accent-yellow); border-color: var(--accent-yellow); }

        /* QUIZ */
        .quiz-item { text-align: left; padding: 25px; margin: 20px 0; }
        .quiz-option { 
            display: block; padding: 12px; margin: 8px 0; border-radius: 10px; 
            background: rgba(255,255,255,0.03); border: 1px solid transparent; cursor: pointer;
        }
        .quiz-correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .quiz-incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        #loading { display: none; margin: 20px; animation: pulse 1.5s infinite; color: #d8b4fe; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Maturitní Pomocník</h1>
        
        <div class="glass-panel header-box">
            <input type="file" id="fileInput" accept=".pdf,.txt">
            <button class="btn-purple" onclick="uploadFile()">Vygenerovat materiály</button>
            <p id="loading">Gemma analyzuje text... Může to trvat až minutu.</p>
        </div>

        <nav style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
            <button onclick="showSection('flash')" class="nav-btn active">Kartičky</button>
            <button onclick="showSection('quiz')" class="nav-btn">Test</button>
        </nav>

        <div id="flash" class="section">
            <div class="card-container" onclick="toggleCard()" id="flashCard">
                <div class="card-inner">
                    <div class="glass-panel card-front">
                        <span class="flash-label">Otázka</span>
                        <div id="qText">Nahrajte soubor...</div>
                    </div>
                    <div class="glass-panel card-back">
                        <span class="flash-label">Odpověď</span>
                        <div id="aText">...</div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="prevCard()">← Předchozí</button>
                <button onclick="nextCard()">Další →</button>
            </div>
        </div>

        <div id="quiz" class="section" style="display:none">
            <div id="quizResults" style="display:none; padding: 20px; border-radius: 15px; margin-bottom: 20px; font-weight: bold;"></div>
            <div id="quizBox"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn-purple" onclick="gradeQuiz()">Vyhodnotit</button>
                <button class="btn-yellow" onclick="renderQuiz()">Resetovat</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "sk-0MlocXvcIJNS9usp-OlaAg";
        let store = { flashcards: [], quiz: [] };
        let idx = 0;

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            event.currentTarget.classList.add('active');
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Vyberte soubor!");
            
            document.getElementById('loading').style.display = "block";
            const fd = new FormData(); fd.append("file", file);
            
            try {
                const r = await fetch("/upload", { 
                    method: "POST", 
                    headers: {"x-api-key": API_KEY}, 
                    body: fd 
                });
                const res = await r.json();
                if(res.error) throw new Error(res.error);
                
                store = JSON.parse(res.result);
                idx = 0;
                renderFlash();
                renderQuiz();
            } catch(e) {
                alert("Chyba: " + e.message);
            } finally {
                document.getElementById('loading').style.display = "none";
            }
        }

        function toggleCard() { document.getElementById("flashCard").classList.toggle('flipped'); }

        function renderFlash() {
            if(!store.flashcards.length) return;
            document.getElementById("flashCard").classList.remove('flipped');
            setTimeout(() => {
                document.getElementById("qText").innerText = store.flashcards[idx].q;
                document.getElementById("aText").innerText = store.flashcards[idx].a;
            }, 150);
        }

        function nextCard() { if(idx < store.flashcards.length-1) { idx++; renderFlash(); } }
        function prevCard() { if(idx > 0) { idx--; renderFlash(); } }

        function renderQuiz() {
            const box = document.getElementById("quizBox");
            document.getElementById('quizResults').style.display = 'none';
            box.innerHTML = store.quiz.map((q, i) => `
                <div class="glass-panel quiz-item" id="q${i}">
                    <p><b>${i+1}. ${q.q}</b></p>
                    ${q.options.map(o => `
                        <label class="quiz-option">
                            <input type="radio" name="q${i}" value="${o}"> ${o}
                        </label>
                    `).join('')}
                </div>
            `).join('');
        }

        function gradeQuiz() {
            let score = 0;
            store.quiz.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                const div = document.getElementById(`q${i}`);
                div.classList.remove('quiz-correct', 'quiz-incorrect');
                
                if(selected && selected.value === q.correct) {
                    score++;
                    div.classList.add('quiz-correct');
                } else {
                    div.classList.add('quiz-incorrect');
                }
            });
            const res = document.getElementById('quizResults');
            res.innerText = `Výsledek: ${score} z ${store.quiz.length}`;
            res.style.display = 'block';
            res.style.background = score > 5 ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)';
        }
    </script>
</body>
</html>
